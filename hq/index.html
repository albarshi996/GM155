const _texLoader = new THREE.TextureLoader();

      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;\nvarying vec3 vWN;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;\nvWN=normalize(mat3(modelMatrix)*objectNormal);');
    const fn = '\nvarying vec3 vWP;\nvarying vec3 vWN;\nuniform float uTriS;\nvec3 triW(vec3 n){vec3 b=abs(n);b=pow(b,vec3(4.0));return b/max(b.x+b.y+b.z,1e-4);}\nvec4 triT(sampler2D s,vec3 p,vec3 w){return texture2D(s,p.zy)*w.x+texture2D(s,p.xz)*w.y+texture2D(s,p.xy)*w.z;}\n';

const _rt = {

  wall:      { d: 'wall_Diffuse.jpg', a: 'wall_arm.jpg', scale: 1 / 3.0, roughness: 0.92, metalness: 0 },
  rackmetal: { d: 'rackmetal_Diffuse.jpg', a: 'rackmetal_arm.jpg', scale: 1 / 1.2, roughness: 0.5, metalness: 0.75, env: 1.0 },

  roleMat[r] = mk();
  const p = mk(); p.emissive = new THREE.Color(0xe8781f); p.emissiveIntensity = 0.08; roleMatP[r] = p;      // مقترح
  const cc = mk(); cc.emissive = new THREE.Color(0x5b9bd5); cc.emissiveIntensity = 0.06; roleMatC[r] = cc;   // تصوّري

const TYPE_ROLE = { floor:'floor', zonefloor:'floor', concrete:'floor', apron:'floor',
  wall:'wall', building:'wall', office:'wall', cold:'wall',
  rack_up:'rackmetal', rack_bm:'rackmetal', col:'rackmetal', roof:'roofmetal', roof2:'roofmetal' };

sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);

const clock = new THREE.Clock();

camera.position.set(40, 20, 40);
const controls = new CameraControls(camera, canvas);

// ---- post: N8AO contact shadows (defensive — falls back to direct render on failure) ----

  composer.addPass(new RenderPass(scene, camera));
  n8aoPass = new N8AOPass(scene, camera, innerWidth, innerHeight);
  n8aoPass.configuration.aoRadius = 0.6;
  n8aoPass.configuration.distanceFalloff = 1.0;

// ---- generic materials for non-role types (batched; per-instance colour) ----
function gmat(rough, metal, extra) { return new THREE.MeshStandardMaterial(Object.assign({ color: 0xffffff, roughness: rough, metalness: metal, envMapIntensity: 0.9 }, extra || {})); }
const matMatte = gmat(0.85, 0.0), matMetal = gmat(0.45, 0.55);
const matMatteP = gmat(0.85, 0.0), matMetalP = gmat(0.45, 0.55);
matMatteP.emissive = new THREE.Color(0xe8781f); matMatteP.emissiveIntensity = 0.08;
matMetalP.emissive = new THREE.Color(0xe8781f); matMetalP.emissiveIntensity = 0.08;
const matGlass = new THREE.MeshStandardMaterial({ color: 0x9fc0e0, roughness: 0.1, metalness: 0, transparent: true, opacity: 0.4 });
const matLight = new THREE.MeshStandardMaterial({ color: 0xfff0d0, emissive: new THREE.Color(0xfff0d0), emissiveIntensity: 1.1 });

function pickMat(b, proposed) {

  if (role) {
    if (proposed) { usedProposed = true; return { m: roleMatP[role], tint: false }; }
    if (classify(b).t.indexOf('تصوّري') >= 0) { usedConcept = true; return { m: roleMatC[role], tint: false }; }
    return { m: roleMat[role], tint: false };

// ---- load GLBs → collect instances (batched render, few draw calls on the iGPU) ----
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);

let usedProposed = false, usedConcept = false;
let BOX = {};
const elIndex = {};        // elementId -> { bm, iid, box, type, baseColor }
let batchedGroup = null;

async function loadData() {

    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = '../site_scene.js?v=' + Date.now(); s.onload = res; s.onerror = rej; document.head.appendChild(s); });

  const g = await loader.loadAsync(url);

  g.scene.traverse((o) => {

    const id = (o.userData && o.userData.elementId) || o.name;

}
function row(k, v) { return '<div class="r"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
function selectEl(id) {
  clearSel();
  const e = elIndex[id]; if (!e) return;
  selEl = id; e.bm.setColorAt(e.iid, _GOLD);
  e.bm.getMatrixAt(e.iid, _m4);
  const bx = _unit.clone().applyMatrix4(_m4).applyMatrix4(e.bm.matrixWorld);
  selBox = new THREE.Box3Helper(bx, 0xf0b429); scene.add(selBox);
  const b = e.box, cl = classify(b);
  let nm = b && b.label ? b.label.split('—')[0].split('·')[0].trim() : (b ? (TYPE_AR[b.type] || b.type) : id);
  ct.textContent = (nm || id).slice(0, 44);
  let h = row('المعرّف', id);
  if (b) {
    h += row('النوع', (TYPE_AR[b.type] || b.type) + (b.group ? ' · ' + b.group : ''));
    if (b.label) h += row('الوصف', b.label);
    h += '<div class="r"><span class="k">التصنيف</span><span class="v"><span class="cls" style="background:' + cl.c + '">' + cl.t + '</span></span></div>';
    if (b.system) h += row('المنظومة', b.system);

}
canvas.addEventListener('pointerup', (e) => {
  if (e._moved || !batchedGroup) return;
  ndc.x = (e.clientX / innerWidth) * 2 - 1; ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(batchedGroup, true);
  if (hits.length && hits[0].batchId !== undefined && hits[0].object.userData.b2el) {
    const id = hits[0].object.userData.b2el[hits[0].batchId];
    if (id) selectEl(id); else clearSel();
  } else clearSel();
});
let downX, downY;
canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', (e) => { e._moved = Math.hypot(e.clientX - downX, e.clientY - downY) > 6; }, true);
document.getElementById('cx').onclick = clearSel;

// ---- fit / framing ----
const fitBox = new THREE.Box3();
const _CTX_RE = /^(ctx_|desert|horizon|ground)/;
// Per-scene depth range. A tight near/far ratio keeps the depth buffer precise, so the
// many near-coplanar ground strips (pad · lanes · roads) stop z-fighting across the 460m site.
// WHE5 needs a small near for the interior walk-through; the site-scale views can afford a larger one.
function applyDepthRange() {
  // near/far: a tight ratio keeps depth precise so coplanar ground strips stop z-fighting.
  // minD/maxD (per-scene too): keep minDistance > near so dolly-in never clips at the near plane,
  // and cap the overview zoom so the central ground is never viewed far enough to out-run the buffer.
  let near, far, minD, maxD;
  if (SCENE_ID === 'WHE5')    { near = 0.2; far = 1500; minD = 1;   maxD = 600; }
  else if (SCENE_ID === 'Z3') { near = 0.5; far = 2000; minD = 1.5; maxD = 600; }
  else                        { near = 1.5; far = 3000; minD = 3;   maxD = 720; }
  if (camera.near !== near || camera.far !== far) { camera.near = near; camera.far = far; camera.updateProjectionMatrix(); }
  controls.minDistance = minD; controls.maxDistance = maxD;
}
function fitAll(transition) {
  applyDepthRange();
  fitBox.makeEmpty();
  for (const id in elIndex) {           // frame the plot, not the surrounding desert/context plane
    if (_CTX_RE.test(id)) continue;
    const e = elIndex[id]; e.bm.getMatrixAt(e.iid, _m4);
    fitBox.expandByPoint(new THREE.Vector3().setFromMatrixPosition(_m4));
  }
  if (fitBox.isEmpty() && batchedGroup) batchedGroup.children.forEach((bm) => { if (bm.boundingBox) fitBox.union(bm.boundingBox); });
  if (fitBox.isEmpty()) return;
  fitBox.expandByScalar(6);
  const c = fitBox.getCenter(new THREE.Vector3()), s = fitBox.getSize(new THREE.Vector3());
  const d = Math.max(s.x, s.z) * 0.62 + s.y * 2;
  controls.setLookAt(c.x + d * 0.75, c.y + Math.max(s.y * 3, d * 0.55), c.z + d * 0.75, c.x, c.y, c.z, !!transition);
  sun.position.set(c.x + s.x, c.y + s.y * 2 + 30, c.z + s.z * 0.6);
  sun.target.position.copy(c);
  const r = s.length();
  sun.shadow.camera.left = -r; sun.shadow.camera.right = r; sun.shadow.camera.top = r; sun.shadow.camera.bottom = -r;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = r * 4; sun.shadow.camera.updateProjectionMatrix();
  renderer.shadowMap.needsUpdate = true; needRender();
}
document.getElementById('fit').onclick = () => fitAll(true);
document.getElementById('top').onclick = () => {
  const c = fitBox.getCenter(new THREE.Vector3()), s = fitBox.getSize(new THREE.Vector3());
  controls.setLookAt(c.x, c.y + s.length(), c.z + 0.001, c.x, c.y, c.z, true); needRender();
};
document.getElementById('ghost').onchange = (e) => {
  const on = e.target.checked;
  for (const m of [...Object.values(roleMatP), ...Object.values(roleMatC), ...PROPOSED_GENERICS]) { m.transparent = on; m.opacity = on ? 0.45 : 1.0; m.depthWrite = !on; m.needsUpdate = true; }
  renderer.shadowMap.needsUpdate = true; needRender();
};
function setRoof(on){ for (const id in elIndex) { const e = elIndex[id]; if (e.type === 'roof' || e.type === 'roof2') e.bm.setVisibleAt(e.iid, on); } renderer.shadowMap.needsUpdate = true; needRender(); }
const roofCb=document.getElementById('roof'); if(roofCb) roofCb.onchange=(e)=>setRoof(e.target.checked);
document.getElementById('inside').onclick=()=>{ if(roofCb) roofCb.checked=false; setRoof(false);
  const c=fitBox.getCenter(new THREE.Vector3());
  controls.setLookAt(fitBox.min.x+3, 1.8, c.z, fitBox.max.x-4, 1.5, c.z, true); needRender(); };

// ---- ground + per-scene UI (shared helpers for boot and scene-switching) ----
function placeGround() {
  const gc = fitBox.getCenter(new THREE.Vector3());
  if (!ground) {
    try {
      const gt = loadTex('asphalt_Diffuse.jpg', true), ga = loadTex('asphalt_arm.jpg', false);
      gt.repeat.set(120, 120); ga.repeat.set(120, 120);
      ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800),
        new THREE.MeshStandardMaterial({ map: gt, roughnessMap: ga, metalnessMap: ga, roughness: 0.97, metalness: 0 }));
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    } catch (e) { console.warn('ground', e); return; }
  }
  ground.position.set(gc.x, -0.03, gc.z);
  // The GLB also carries a site-wide 'ground' slab ~2cm below this textured pad — fully hidden by
  // the pad, so drop it: a coplanar duplicate is pure z-fight fuel (the 20mm gap) and wasted overdraw.
  for (const id in elIndex) { const e = elIndex[id]; if (e.type === 'ground') e.bm.setVisibleAt(e.iid, false); }
  renderer.shadowMap.needsUpdate = true;
}
function refreshSceneUI() {
  const _sub = document.querySelector('#hud .sub');
  if (_sub) _sub.textContent = SCENE_NAME + ' · three r0.185 · GLB من Blender';
  const _legend = document.getElementById('legend');
  if (_legend) {
    let lh = '<span class="sw" style="background:#9aa3ad"></span>الهيكل (قائم)';
    if (usedConcept) lh += ' &nbsp;·&nbsp; <span class="sw" style="background:#5b9bd5"></span>الرفوف/التجهيزات (تصوّري)';
    if (usedProposed) lh += ' &nbsp;·&nbsp; <span class="sw" style="background:#e8a23a"></span>التجهيزات (مقترح)';
    _legend.innerHTML = lh;
  }
  const _ghost = document.getElementById('ghost'), _ghostLbl = _ghost ? _ghost.closest('label') : null;
  if (_ghostLbl) {
    if (!(usedProposed || usedConcept)) _ghostLbl.style.display = 'none';
    else { _ghostLbl.style.display = ''; _ghostLbl.childNodes[_ghostLbl.childNodes.length - 1].textContent = ' إبراز غير القائم شفّافًا'; }
  }
  const _cats = ['قائم'].concat(usedConcept ? ['تصوّري'] : [], usedProposed ? ['مقترح'] : []).join(' + ');
  const _st = document.getElementById('stats'); if (_st) _st.textContent = 'عناصر: ' + Object.keys(elIndex).length + ' · ' + _cats + ' · اختر عنصرًا بالنقر';
}

// ---- in-place scene switching (reuses shared materials/textures/BOX; only reloads GLBs) ----
function teardownScene() {
  clearSel();
  if (batchedGroup) {
    scene.remove(batchedGroup);
    batchedGroup.children.forEach((bm) => { try { bm.dispose && bm.dispose(); } catch (e) {} });
    batchedGroup = null;
  }
  const seen = new Set();   // dispose this scene's source geometries (new GLB load makes fresh ones)
  for (const it of collected) { if (it.geometry && !seen.has(it.geometry.uuid)) { seen.add(it.geometry.uuid); try { it.geometry.dispose(); } catch (e) {} } }
  collected.length = 0;
  for (const k in elIndex) delete elIndex[k];
  // usedProposed/usedConcept are set by the incoming load (before teardown runs), so teardown must NOT reset them here
  // ghost() mutates these shared materials in place — restore them to opaque for the next scene
  for (const m of [...Object.values(roleMatP), ...Object.values(roleMatC), ...PROPOSED_GENERICS]) { m.transparent = false; m.opacity = 1.0; m.depthWrite = true; m.needsUpdate = true; }
}
let switching = true;   // stays true until the initial boot load completes (blocks early switch clicks → no concurrent loads)
async function switchScene(id) {
  if (switching || id === SCENE_ID) return;   // SCENE_ID only ever names the scene actually loaded, so a failed target stays retriable
  switching = true;
  const btns = document.querySelectorAll('#scenes button'); btns.forEach((b) => b.disabled = true);
  const _ld = document.getElementById('load');
  if (_ld) { _ld.textContent = '…جارٍ تحميل مشهد ' + nameOf(id) + ' عالي الجودة'; _ld.style.display = 'flex'; }
  await new Promise((r) => setTimeout(r, 30));   // yield so the overlay paints (rAF is paused in background tabs, so don't depend on it)
  // load-first: fetch into a holding array; the CURRENT scene keeps rendering until the new one is fully in hand
  const incoming = []; const _pP = usedProposed, _pC = usedConcept; usedProposed = false; usedConcept = false;
  try {
    await Promise.all([
      collectGLB('models/site_built_' + id + '.opt.glb', false, incoming),
      collectGLB('models/site_proposed_' + id + '.opt.glb', true, incoming),
    ]);
  } catch (e) {   // load failed → discard the half-loaded data, leave the live scene (and SCENE_ID) untouched → same button stays retriable
    console.error('switchScene load', e);
    const seen = new Set();
    for (const it of incoming) { if (it.geometry && !seen.has(it.geometry.uuid)) { seen.add(it.geometry.uuid); try { it.geometry.dispose(); } catch (_) {} } }
    usedProposed = _pP; usedConcept = _pC;
    if (_ld) _ld.style.display = 'none';
    const _st = document.getElementById('stats'); if (_st) _st.textContent = 'تعذّر تحميل المشهد — تحقّق من الاتصال وأعد المحاولة';
    btns.forEach((b) => b.disabled = false); switching = false;
    return;
  }
  // commit: the new scene is loaded → now tear down the old one and build the new
  teardownScene();                              // clears `collected` (now empty)
  for (const it of incoming) collected.push(it); // loop, not spread — incoming can be 7560 items
  SCENE_ID = id; applySceneMeta();
  buildBatches();
  fitAll(false);
  placeGround();
  refreshSceneUI();
  const _roof = document.getElementById('roof'); if (_roof) _roof.checked = true;     // new scene starts with roofs on
  const _ghost = document.getElementById('ghost'); if (_ghost) _ghost.checked = false; // and ghost off
  if (window.__hq) window.__hq.batchedGroup = batchedGroup;
  needRender();
  if (_ld) _ld.style.display = 'none';
  btns.forEach((b) => b.disabled = false); switching = false;
}
document.querySelectorAll('#scenes button').forEach((b) => b.addEventListener('click', () => switchScene(b.dataset.scene)));

// ---- render-on-demand ----
let needsRender = true;
function needRender() { needsRender = true; }
controls.addEventListener('update', needRender);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (composer) composer.setSize(innerWidth, innerHeight);
  needRender();
});
// While the camera is moving we skip the N8AO pass (≈half the frame cost) for fluid
// interaction, then render one full-quality AO frame the moment it comes to rest.
function renderFrame(moving) { if (composer && !moving) composer.render(); else renderer.render(scene, camera); }
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const updated = controls.update(dt);
  if (updated) { renderFrame(true); needsRender = true; }            // moving → cheap frame; still owe a final AO frame
  else if (needsRender) { needsRender = false; renderFrame(false); } // at rest → one crisp AO frame
}

// ---- boot ----
(async () => {
  await loadData();
  await Promise.all([
    collectGLB('models/site_built_' + SCENE_ID + '.opt.glb', false),
    collectGLB('models/site_proposed_' + SCENE_ID + '.opt.glb', true),
  ]);
  buildBatches();
  fitAll(false);
  placeGround();
  refreshSceneUI();
  document.getElementById('load').style.display = 'none';
  animate();
  window.__hq = { scene, camera, controls, renderer, composer, n8aoPass, elIndex, batchedGroup, fitAll, renderFrame, selectEl, clearSel, switchScene };
  switching = false;   // boot complete → enable scene switching
  document.querySelectorAll('#scenes button').forEach((b) => b.disabled = false);
})().catch((e) => { document.getElementById('load').textContent = 'خطأ: ' + e.message; console.error(e); });
</script>
